name: Build kernel
on:
  push:
    branches: [merlin-r-oss]
  workflow_dispatch:

env:
  DEFCONFIG: merlin_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio zip curl git python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Get clang
        run: |
          mkdir -p $HOME/tc/clang
          curl -fL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz" | tar xz -C $HOME/tc/clang
          echo "$HOME/tc/clang/bin" >> $GITHUB_PATH

      - name: Add KernelSU-Next (no kprobes)
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          sed -i '/CONFIG_KPROBES/d;/CONFIG_KPROBE_EVENTS/d;/CONFIG_KSU/d;/CONFIG_MTK_ENG_BUILD/d;/CONFIG_MODULE_FORCE_LOAD/d;/CONFIG_MODULE_SIG_FORCE/d' arch/arm64/configs/$DEFCONFIG
          cat >> arch/arm64/configs/$DEFCONFIG <<'EOF'
          CONFIG_KSU=y
          # CONFIG_KPROBES is not set
          # CONFIG_KPROBE_EVENTS is not set
          # CONFIG_KSU_KPROBE_HOOK is not set
          # CONFIG_KSU_KPROBE_HOOKS is not set
          CONFIG_KSU_MANUAL_HOOK=y
          # CONFIG_MTK_ENG_BUILD is not set
          CONFIG_MODULE_FORCE_LOAD=y
          # CONFIG_MODULE_SIG_FORCE is not set
          CONFIG_LOCALVERSION="-g3851971ffd50"
          # CONFIG_LOCALVERSION_AUTO is not set
          EOF

      - name: Patch manual hooks and path_umount
        run: |
          python3 - <<'PYEOF'
          import glob
          import re

          ksu_src = ""
          for p in glob.glob("drivers/kernelsu/**/*.c", recursive=True) + glob.glob("drivers/kernelsu/**/*.h", recursive=True):
              with open(p, errors="ignore") as f:
                  ksu_src += f.read() + "\n"

          found = sorted(set(re.findall(r"ksu_handle_[a-zA-Z0-9_]+", ksu_src)))
          print("Found KSU hooks:", found)

          def patch_file(path, fn_sig, extern_code, anchor, hook_code):
              with open(path, "r") as f:
                  text = f.read()
              if "CONFIG_KSU" in text:
                  print(f"Skip (already patched): {path}")
                  return
              fn_pos = text.find(fn_sig)
              if fn_pos == -1:
                  raise RuntimeError(f"Function '{fn_sig}' not found in {path}")
              anch_pos = text.find(anchor, fn_pos)
              if anch_pos == -1:
                  raise RuntimeError(f"Anchor '{anchor}' not found in {path}")
              text = text[:anch_pos] + hook_code + text[anch_pos:]
              text = text[:fn_pos] + extern_code + text[fn_pos:]
              with open(path, "w") as f:
                  f.write(text)
              print(f"Patched: {path}")

          if "ksu_handle_sys_reboot(" in ksu_src:
              ext = (
                  "#ifdef CONFIG_KSU\n"
                  "extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n"
                  "#endif\n"
              )
              hk = (
                  "#ifdef CONFIG_KSU\n"
                  "\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n"
                  "#endif\n\t"
              )
              patch_file("kernel/reboot.c", "SYSCALL_DEFINE4(reboot,", ext, "if (!ns_capable(pid_ns->user_ns, CAP_SYS_BOOT))", hk)

          if "ksu_handle_execveat(" in ksu_src:
              if "ksu_execveat_hook" in ksu_src and "ksu_handle_execveat_sucompat(" in ksu_src:
                  ext = (
                      "#ifdef CONFIG_KSU\n"
                      "extern bool ksu_execveat_hook __read_mostly;\n"
                      "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n"
                      "extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n"
                      "#endif\n"
                  )
                  hk = (
                      "#ifdef CONFIG_KSU\n"
                      "\tif (unlikely(ksu_execveat_hook))\n"
                      "\t\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n"
                      "\telse\n"
                      "\t\tksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);\n"
                      "#endif\n\t"
                  )
              else:
                  ext = (
                      "#ifdef CONFIG_KSU\n"
                      "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n"
                      "#endif\n"
                  )
                  hk = (
                      "#ifdef CONFIG_KSU\n"
                      "\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n"
                      "#endif\n\t"
                  )
              patch_file("fs/exec.c", "static int do_execveat_common(", ext, "if (IS_ERR(filename))", hk)
          elif "ksu_handle_execve_sucompat(" in ksu_src:
              ext = (
                  "#ifdef CONFIG_KSU\n"
                  "extern int ksu_handle_execve_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n"
                  "#endif\n"
              )
              hk = (
                  "#ifdef CONFIG_KSU\n"
                  "\tksu_handle_execve_sucompat(&fd, &filename, NULL, NULL, NULL);\n"
                  "#endif\n\t"
              )
              patch_file("fs/exec.c", "static int do_execveat_common(", ext, "if (IS_ERR(filename))", hk)

          if "ksu_handle_faccessat(" in ksu_src:
              ext = (
                  "#ifdef CONFIG_KSU\n"
                  "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n"
                  "#endif\n"
              )
              hk = (
                  "#ifdef CONFIG_KSU\n"
                  "\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n"
                  "#endif\n\t"
              )
              patch_file("fs/open.c", "SYSCALL_DEFINE3(faccessat,", ext, "if (mode & ~S_IRWXO)", hk)

          if "ksu_handle_vfs_read(" in ksu_src:
              if "ksu_vfs_read_hook" in ksu_src:
                  ext = (
                      "#ifdef CONFIG_KSU\n"
                      "extern bool ksu_vfs_read_hook __read_mostly;\n"
                      "extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\n"
                      "#endif\n"
                  )
                  hk = (
                      "#ifdef CONFIG_KSU\n"
                      "\tif (unlikely(ksu_vfs_read_hook))\n"
                      "\t\tksu_handle_vfs_read(&file, &buf, &count, &pos);\n"
                      "#endif\n\t"
                  )
              else:
                  ext = (
                      "#ifdef CONFIG_KSU\n"
                      "extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\n"
                      "#endif\n"
                  )
                  hk = (
                      "#ifdef CONFIG_KSU\n"
                      "\tksu_handle_vfs_read(&file, &buf, &count, &pos);\n"
                      "#endif\n\t"
                  )
              patch_file("fs/read_write.c", "ssize_t vfs_read(", ext, "if (!(file->f_mode & FMODE_READ))", hk)

          if "ksu_handle_stat(" in ksu_src:
              ext = (
                  "#ifdef CONFIG_KSU\n"
                  "extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n"
                  "#endif\n"
              )
              hk = (
                  "#ifdef CONFIG_KSU\n"
                  "\tksu_handle_stat(&dfd, &filename, &flags);\n"
                  "#endif\n\t"
              )
              patch_file("fs/stat.c", "int vfs_statx(", ext, "if ((flags & ~(AT_SYMLINK_NOFOLLOW", hk)

          if "ksu_handle_input_handle_event(" in ksu_src:
              if "ksu_input_hook" in ksu_src:
                  ext = (
                      "#ifdef CONFIG_KSU\n"
                      "extern bool ksu_input_hook __read_mostly;\n"
                      "extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n"
                      "#endif\n"
                  )
                  hk = (
                      "#ifdef CONFIG_KSU\n"
                      "\tif (unlikely(ksu_input_hook))\n"
                      "\t\tksu_handle_input_handle_event(&type, &code, &value);\n"
                      "#endif\n\t"
                  )
              else:
                  ext = (
                      "#ifdef CONFIG_KSU\n"
                      "extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n"
                      "#endif\n"
                  )
                  hk = (
                      "#ifdef CONFIG_KSU\n"
                      "\tksu_handle_input_handle_event(&type, &code, &value);\n"
                      "#endif\n\t"
                  )
              patch_file("drivers/input/input.c", "void input_event(", ext, "if (is_event_supported(type, dev->evbit, EV_MAX))", hk)

          # Backport path_umount for Linux 4.14
          with open("fs/namespace.c", "r") as f:
              ns = f.read()
          if "int path_umount(" not in ns:
              umount_code = """static int can_umount(const struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);

          	if (!may_mount())
          		return -EPERM;
          	if (path->dentry != path->mnt->mnt_root)
          		return -EINVAL;
          	if (!check_mnt(mnt))
          		return -EINVAL;
          	if (mnt->mnt.mnt_flags & MNT_LOCKED)
          		return -EINVAL;
          	if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
          		return -EPERM;
          	return 0;
          }

          int path_umount(struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);
          	int ret;

          	ret = can_umount(path, flags);
          	if (!ret)
          		ret = do_umount(mnt, flags);

          	dput(path->dentry);
          	mntput_no_expire(mnt);
          	return ret;
          }

          """
              pos = ns.find("SYSCALL_DEFINE2(umount,")
              if pos == -1:
                  raise RuntimeError("SYSCALL_DEFINE2(umount not found in fs/namespace.c")
              ns = ns[:pos] + umount_code + ns[pos:]
              with open("fs/namespace.c", "w") as f:
                  f.write(ns)
              print("Patched: fs/namespace.c (path_umount)")

          with open("include/linux/fs.h", "r") as f:
              fsh = f.read()
          if "path_umount(" not in fsh:
              pos = fsh.rfind("#endif")
              fsh = fsh[:pos] + "\nextern int path_umount(struct path *path, int flags);\n" + fsh[pos:]
              with open("include/linux/fs.h", "w") as f:
                  f.write(fsh)
              print("Patched: include/linux/fs.h (path_umount)")
          PYEOF

      - name: Fix SSPM bootloop (sspm_reserve_memory_init)
        run: |
          python3 - <<'PYEOF'
          import glob
          import re

          def replace_bugs(body):
              out = []
              i = 0
              n = len(body)
              while i < n:
                  if body.startswith("BUG_ON(", i):
                      j = i + len("BUG_ON(")
                      depth = 1
                      while j < n and depth > 0:
                          if body[j] == "(":
                              depth += 1
                          elif body[j] == ")":
                              depth -= 1
                          j += 1
                      cond = body[i + len("BUG_ON("):j - 1]
                      if j < n and body[j] == ";":
                          j += 1
                      out.append(f'{{ if ({cond}) {{ pr_err("[SSPM] reserve mem check failed, skip panic\\n"); return -1; }} }}')
                      i = j
                  elif body.startswith("BUG()", i):
                      j = i + len("BUG()")
                      if j < n and body[j] == ";":
                          j += 1
                      out.append('{ pr_err("[SSPM] reserve mem BUG skipped\\n"); return -1; }')
                      i = j
                  else:
                      out.append(body[i])
                      i += 1
              return "".join(out)

          patched = 0
          for path in glob.glob("drivers/misc/mediatek/sspm/**/*.c", recursive=True):
              with open(path, "r", errors="ignore") as f:
                  text = f.read()
              m = re.search(r"int\s+sspm_reserve_memory_init\s*\([^)]*\)\s*\{", text)
              if not m:
                  continue
              start = m.end() - 1
              depth = 0
              end = start
              while end < len(text):
                  if text[end] == "{":
                      depth += 1
                  elif text[end] == "}":
                      depth -= 1
                      if depth == 0:
                          end += 1
                          break
                  end += 1
              orig_body = text[start:end]
              new_body = replace_bugs(orig_body)
              if new_body != orig_body:
                  text = text[:start] + new_body + text[end:]
                  with open(path, "w") as f:
                      f.write(text)
                  print(f"Patched SSPM: {path}")
                  patched += 1

          print(f"Total SSPM files patched: {patched}")
          PYEOF

      - name: Allow stock vendor modules (fix WiFi and Bluetooth)
        run: |
          python3 - <<'PYEOF'
          import re

          with open("kernel/module.c", "r") as f:
              mc = f.read()

          changed = False

          target_magic = "return strcmp(amagic, bmagic) == 0;"
          if target_magic in mc:
              mc = mc.replace(target_magic, "return 1; /* allow stock vendor modules */", 1)
              print("Patched: same_magic() in kernel/module.c")
              changed = True
          else:
              print("WARNING: same_magic return not found")

          m = re.search(r"(bad_version:\s*(?:pr_warn|printk)\([^;]+;\s*)return 0;", mc)
          if m:
              mc = mc[:m.start()] + m.group(1) + "return 1; /* allow stock vendor modules */" + mc[m.end():]
              print("Patched: check_version() in kernel/module.c")
              changed = True
          else:
              print("WARNING: bad_version block not found")

          if changed:
              with open("kernel/module.c", "w") as f:
                  f.write(mc)
          PYEOF

      - name: Stub missing firmware include
        run: |
          d=drivers/input/touchscreen/mediatek/focaltech_touch/include/firmware
          mkdir -p $d
          [ -f $d/fw_sample.i ] || echo "0x00," > $d/fw_sample.i

      - name: Build
        run: |
          mkdir -p out
          ARGS="O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          make $ARGS $DEFCONFIG > /dev/null 2>&1
          grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_MODULE|CONFIG_MODVERSIONS" out/.config || true
          make -j$(nproc) $ARGS > build.log 2>&1 || {
            echo "=== ERRORS ==="
            grep -n -E "error:|ERROR:|undefined reference|No such file|fatal error|\*\*\*.*Stop|Error [0-9]" build.log | head -40 || true
            echo "=== LAST 40 LINES ==="
            tail -40 build.log
            exit 1
          }
          cat out/include/config/kernel.release

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/.github ak3/README.md
          cp out/arch/arm64/boot/Image.gz ak3/
          cat > ak3/anykernel.sh <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=KernelSU-Next kernel for Redmi Note 9
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=merlin
          device.name2=merlinx
          device.name3=merlinnfc
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=/dev/block/platform/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF
          cd ak3 && zip -r9 ../KernelSU-Next-merlin.zip . -x "*.git*"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: |
            KernelSU-Next-merlin.zip
            out/arch/arm64/boot/Image*
            build.log
