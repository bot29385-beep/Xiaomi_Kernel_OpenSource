name: Build kernel
on:
  push:
    branches: [merlin-r-oss]
  workflow_dispatch:

env:
  DEFCONFIG: merlin_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio zip curl git python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Get clang
        run: |
          mkdir -p $HOME/tc/clang
          curl -fL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz" | tar xz -C $HOME/tc/clang
          echo "$HOME/tc/clang/bin" >> $GITHUB_PATH

      - name: Add KernelSU-Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          cat >> arch/arm64/configs/$DEFCONFIG <<'EOF'
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU_KPROBE_HOOKS=y
          CONFIG_LOCALVERSION="-g3851971ffd50"
          # CONFIG_LOCALVERSION_AUTO is not set
          EOF

      - name: Stub missing firmware include
        run: |
          d=drivers/input/touchscreen/mediatek/focaltech_touch/include/firmware
          mkdir -p $d
          [ -f $d/fw_sample.i ] || echo "0x00," > $d/fw_sample.i

      - name: Build
        run: |
          mkdir -p out
          ARGS="O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          make $ARGS $DEFCONFIG > /dev/null 2>&1
          make -k -j$(nproc) $ARGS > build.log 2>&1 || {
            echo "=== ERRORS ==="
            grep -n -E "error:|undefined reference|No such file|fatal error" build.log | head -40
            exit 1
          }
          cat out/include/config/kernel.release

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/.github ak3/README.md
          cp out/arch/arm64/boot/Image.gz-dtb ak3/
          cat > ak3/anykernel.sh <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=KernelSU-Next kernel for Redmi Note 9
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=merlin
          device.name2=merlinx
          device.name3=merlinnfc
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=/dev/block/platform/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF
          cd ak3 && zip -r9 ../KernelSU-Next-merlin.zip . -x "*.git*"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: |
            KernelSU-Next-merlin.zip
            out/arch/arm64/boot/Image*
            build.log
